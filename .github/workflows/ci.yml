name: ci
on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Setup Bats and bats libs
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # v4.1.0

      - name: Verify go.mod is sane
        run: go mod tidy && git diff --no-patch --exit-code

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Create Integration Pre-Reqs
        run: ./scripts/generate-test-chart.sh

      - name: Upload helm-sigstore-test-0.1.0.tgz
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-sigstore-test-0.1.0.tgz
          path: |
            helm-sigstore-test-0.1.0.tgz
            helm-sigstore-test-0.1.0.tgz.prov
            .gnupg/sigstore-secring.gpg

      - name: Integration Test
        run: make integration
